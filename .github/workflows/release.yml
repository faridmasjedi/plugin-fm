name: Release

# Runs when a release is published (publish the draft that "Release draft" keeps up to date).
# Three steps, each waiting for approval in the "release" environment (Actions → this run →
# Review deployments); a repository admin can bypass. Nothing is pushed to main: the
# release tag sets one version for the plugin, the browser extension and VS Code
# (scripts/set-version.mjs). If the tests or the files fail, the release goes back to a draft.
on:
  release:
    types: [published]

permissions:
  contents: write # release files
  packages: write # container image

concurrency: release

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  test:
    name: 1. Build and test
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: One version for the plugin and both extensions
        run: node scripts/set-version.mjs "$TAG"
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test
      - name: Studio tests
        run: yarn --cwd nomadsf install --frozen-lockfile && yarn --cwd nomadsf test

  files:
    name: 2. Release files
    needs: test
    runs-on: ubuntu-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: One version for the plugin and both extensions
        run: node scripts/set-version.mjs "$TAG"
      - run: yarn install --frozen-lockfile
      - run: yarn build
      # NomadSF Studio goes into the plugin (dashboard/studio) and the browser extension zip
      - run: yarn build:studio
      - name: VS Code extension
        run: yarn --cwd nomadsf/apps/vscode package
      - name: Attach to the release
        run: |
          npm pack
          gh release upload "$TAG" *.tgz nomadsf/apps/extension/nomadsf-extension.zip nomadsf/apps/vscode/nomadsf-vscode.vsix --clobber

  docker:
    name: 3. Docker image
    needs: files
    runs-on: ubuntu-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      # The plugin tarball attached in step 2 (no Actions artifacts)
      - name: Plugin tarball
        id: pack
        run: |
          gh release download "$TAG" --pattern '*.tgz'
          echo "file=$(ls *.tgz)" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.release
          push: true
          build-args: PLUGIN_TARBALL=${{ steps.pack.outputs.file }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nomadsf:${{ steps.pack.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nomadsf:latest

  back-to-draft:
    name: Back to draft (tests or files failed)
    needs: [test, files]
    if: failure() && (needs.test.result == 'failure' || needs.files.result == 'failure')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=true
