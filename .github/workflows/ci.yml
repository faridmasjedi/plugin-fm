name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # compile + lint
      - run: yarn build
      # unit tests, command snapshot, JSON schemas, deprecation policy, link check
      - run: yarn test

  studio:
    # NomadSF Studio (nomadsf/): core tests, type check, Studio + browser extension build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nomadsf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: nomadsf/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn typecheck
      - run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: nomadsf-extension
          path: nomadsf/apps/extension/nomadsf-extension-*.zip
